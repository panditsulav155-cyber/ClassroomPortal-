{% extends "base.html" %}

{% block title %}Create Cohort Group{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 1.5rem auto;">
    <div style="margin-bottom: 1rem;">
        <a href="{{ url_for('teacher_dashboard') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
            &larr; Back to Dashboard
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Create New Cohort Group</h2>
        </div>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.5rem;">
            A unique 6-character Join Code will be automatically generated upon creation. All fields below are mandatory.
        </p>

        <form method="POST" action="{{ url_for('teacher_create_group') }}">
            <div class="form-group">
                <label class="form-label" for="name">
                    Cohort Group Name <span class="required-star">*</span>
                </label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Grade 10 Biology - Section A" value="{{ name or '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="subject">
                    Subject / Discipline <span class="required-star">*</span>
                </label>
                <input type="text" id="subject" name="subject" class="form-control" required placeholder="e.g. Biological Sciences, Computer Science, Mathematics" value="{{ subject or '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="description">
                    Description &amp; Objectives <span class="required-star">*</span>
                </label>
                <textarea id="description" name="description" class="form-control" required placeholder="Describe course scope, prerequisites, and evaluation expectations...">{{ description or '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.25rem; padding: 0.75rem;">
                Create Cohort Group
            </button>
        </form>
    </div>
</div>
{% endblock %}
