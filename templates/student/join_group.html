{% extends "base.html" %}

{% block title %}Join Cohort Group{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2rem auto;">
    <div style="margin-bottom: 1rem;">
        <a href="{{ url_for('student_dashboard') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
            &larr; Back to Learning Hub
        </a>
    </div>

    <div class="card">
        <div class="card-header" style="justify-content: center; text-align: center; flex-direction: column; gap: 0.35rem;">
            <h2 class="card-title" style="font-size: 1.5rem;">Join a Cohort Group</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">
                Enter the 6-character Join Code provided by your instructor to self-enroll.
            </p>
        </div>

        <form method="POST" action="{{ url_for('student_join_group') }}">
            <div class="form-group">
                <label class="form-label" for="join_code">
                    Classroom Join Code <span class="required-star">*</span>
                </label>
                <input type="text" id="join_code" name="join_code" class="form-control" required
                       maxlength="6" minlength="6"
                       placeholder="e.g. BIO101"
                       style="text-transform: uppercase; font-family: monospace; font-size: 1.25rem; text-align: center; letter-spacing: 0.2em; font-weight: 700;">
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem; padding: 0.75rem; background-color: var(--accent);">
                Enroll in Cohort
            </button>
        </form>
    </div>
</div>
{% endblock %}
