{% extends "base.html" %}

{% block title %}Join Teaching Group{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div style="margin-bottom: 1rem;">
        <a href="{{ url_for('student_dashboard') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
            &larr; Back to Dashboard
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Enroll in a Group</h2>
        </div>
        <form method="POST" action="{{ url_for('student_join_group') }}">
            <div class="form-group">
                <label class="form-label" for="join_code">Group Join Code</label>
                <input type="text" id="join_code" name="join_code" class="form-control" required placeholder="e.g. 7X9K2W" style="text-transform: uppercase; font-family: monospace; font-size: 1.15rem; letter-spacing: 0.1em; text-align: center;">
                <small style="color: var(--text-muted); display: block; margin-top: 0.4rem; text-align: center;">
                    Ask your teacher for the 6-character group code.
                </small>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">
                Join Group
            </button>
        </form>
    </div>
</div>
{% endblock %}
