{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header" style="justify-content: center; text-align: center;">
            <h2 class="card-title">Create an Account</h2>
        </div>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label" for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" required placeholder="e.g. John Doe">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required placeholder="johndoe">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="john@example.com">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">I am registering as:</label>
                <div style="display: flex; gap: 1rem; margin-top: 0.25rem;">
                    <label style="flex: 1; border: 1px solid var(--border-color); padding: 0.75rem; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="role" value="student" checked>
                        <div>
                            <strong>Student</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">Join groups, submit tasks</div>
                        </div>
                    </label>
                    <label style="flex: 1; border: 1px solid var(--border-color); padding: 0.75rem; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="role" value="teacher">
                        <div>
                            <strong>Teacher</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">Create groups, give tasks</div>
                        </div>
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Re-enter password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                Register Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Log in here</a>
        </p>
    </div>
</div>
{% endblock %}
