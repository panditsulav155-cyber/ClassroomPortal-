{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header" style="justify-content: center; text-align: center; flex-direction: column; gap: 0.35rem;">
            <h2 class="card-title" style="font-size: 1.6rem;">Sign In to Portal</h2>
            <div style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.35rem;">
                <span class="user-badge teacher" style="font-size: 0.72rem;">Instructor Access</span>
                <span class="user-badge student" style="font-size: 0.72rem;">Student Access</span>
            </div>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="login_input">
                    Username or Gmail Address <span class="required-star">*</span>
                </label>
                <input type="text" id="login_input" name="login_input" class="form-control" required autofocus placeholder="e.g. yourname@gmail.com or username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    Password <span class="required-star">*</span>
                </label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem; padding: 0.75rem; font-size: 1rem;">
                Sign In to Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Create Account</a>
        </p>
    </div>
</div>
{% endblock %}
