services:
  - type: web
    name: classroomportal
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install gunicorn waitress"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
